spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/walletdb
    username: walletuser
    password: walletpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # or validate (depends if you want auto-create tables)
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:postgresql://localhost:5432/walletdb
    user: walletuser
    password: walletpass
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
